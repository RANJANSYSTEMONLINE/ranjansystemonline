<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANJAN SYSTEM ONLINE</title>
    
    <!-- Futuristic web font -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"> <!-- Font for Code -->
    
    <!-- Markdown & Syntax Highlighting Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark-reasonable.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        /* --- BOOT SEQUENCE STYLES --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Fira Code', monospace; font-size: 16px;
            padding: 20px; box-sizing: border-box; z-index: 100;
        }
        #boot-text-container { display: none; flex-direction: column; justify-content: flex-start; height: 100%; }
        .boot-line { margin: 5px 0; text-shadow: 0 0 5px #0f0; }
        .cursor { display: inline-block; width: 10px; height: 16px; background: #0f0; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Initialize Button Style */
        #init-btn {
            background: transparent; color: #0f0; border: 1px solid #0f0;
            padding: 15px 30px; font-family: 'Fira Code', monospace; font-size: 18px;
            cursor: pointer; text-shadow: 0 0 5px #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            transition: all 0.3s;
        }
        #init-btn:hover { background: rgba(0, 255, 0, 0.2); box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); }

        /* --- Base Futuristic Background --- */
        body { 
            font-family: 'Rajdhani', sans-serif; 
            /* Dark overlay + Aapki Local Background Image */
            background: linear-gradient(rgba(10, 17, 40, 0.6), rgba(1, 3, 8, 0.8)), url('mybackground.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; color: #fff; overflow: hidden;
        }

        /* --- Top Navigation for Models --- */
        #top-nav {
            position: absolute; top: 30px; display: flex; gap: 15px; z-index: 30;
            background: rgba(10, 25, 47, 0.4); padding: 10px 20px; border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.2); backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); flex-wrap: wrap; justify-content: center;
            display: none; /* Hidden until boot finishes */
        }
        .model-btn { background: transparent; color: rgba(0, 255, 255, 0.5); border: 1px solid rgba(0, 255, 255, 0.3); padding: 8px 16px; border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; }
        .model-btn:hover { background: rgba(0, 255, 255, 0.2); color: #fff; border-color: #fff; box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), inset 0 0 10px rgba(0, 255, 255, 0.5); text-shadow: 0 0 8px #ffffff, 0 0 15px #0ff; transform: scale(1.05); }
        .model-btn.active { background: rgba(0, 255, 255, 0.15); color: #fff; border-color: #0ff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 8px rgba(0, 255, 255, 0.3); text-shadow: 0 0 5px #0ff; }
        
        .history-btn { border-color: rgba(255, 0, 255, 0.5); color: rgba(255, 0, 255, 0.8); }
        .history-btn:hover { background: rgba(255, 0, 255, 0.2); color: #fff; border-color: #fff; box-shadow: 0 0 25px rgba(255, 0, 255, 0.8), inset 0 0 10px rgba(255, 0, 255, 0.5); text-shadow: 0 0 8px #ffffff, 0 0 15px #f0f; }

        @keyframes pulseBlink { 0%, 100% { opacity: 1; text-shadow: 0 0 25px rgba(0, 255, 255, 0.8); } 50% { opacity: 0.3; text-shadow: 0 0 5px rgba(0, 255, 255, 0.1); } }

        /* --- HOMEPAGE STYLES --- */
        #homepage { text-align: center; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; width: 100%; }
        #homepage h1 { font-size: 3.5rem; letter-spacing: 5px; color: #0ff; margin-bottom: 10px; text-transform: uppercase; animation: pulseBlink 3.5s infinite ease-in-out; }
        #homepage p { font-size: 1.5rem; color: #a0c0d0; margin-bottom: 40px; letter-spacing: 2px; }

        .chat-now-btn { padding: 15px 40px; background: rgba(0, 255, 255, 0.05); color: #0ff; border: 2px solid #0ff; border-radius: 8px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 3px; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); transition: all 0.3s ease; }
        .chat-now-btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 40px rgba(0, 255, 255, 0.9), inset 0 0 20px rgba(0, 255, 255, 0.6); text-shadow: 0 0 10px #ffffff, 0 0 20px #0ff, 0 0 30px #0ff; color: #fff; transform: scale(1.08); border-color: #fff; }

        /* --- CHAT BOX STYLES --- */
        #chat-box { width: 100%; max-width: 600px; height: 85vh; background: rgba(10, 25, 47, 0.65); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 255, 255, 0.15), inset 0 0 15px rgba(0, 255, 255, 0.1); display: none; flex-direction: column; overflow: hidden; position: relative; }
        #chat-header, #history-header { position: absolute; top: 0; left: 0; width: 100%; background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), rgba(0, 255, 255, 0.25), rgba(0, 255, 255, 0.1)); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0, 255, 255, 0.4); box-shadow: 0 2px 10px rgba(0, 255, 255, 0.2); z-index: 10; padding: 6px 15px; box-sizing: border-box; }
        .system-status { font-weight: 700; letter-spacing: 3px; font-size: 13px; color: #0ff; }
        .close-btn { background: none; border: none; color: #0ff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; letter-spacing: 1px; transition: color 0.2s; }
        .close-btn:hover { color: #fff; text-shadow: 0 0 5px #fff; }

        #messages, #history-content { flex: 1; padding: 50px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.5); border-radius: 10px; }
        
        .msg { padding: 12px 18px; border-radius: 6px; max-width: 85%; line-height: 1.5; font-size: 16px; word-wrap: break-word; letter-spacing: 0.5px; position: relative;}
        .user { background: rgba(0, 120, 255, 0.15); color: #e0f0ff; align-self: flex-end; border: 1px solid rgba(0, 120, 255, 0.5); border-bottom-right-radius: 0; box-shadow: 0 0 15px rgba(0, 120, 255, 0.3); }
        .bot { background: rgba(0, 255, 255, 0.05); color: #e0ffff; align-self: flex-start; border: 1px solid rgba(0, 255, 255, 0.3); border-bottom-left-radius: 0; box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); width: 100%;}
        .timestamp { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Custom Markdown Styles */
        .msg.bot p { margin: 0 0 10px 0; }
        .msg.bot pre { background: #1e1e1e; padding: 10px; border-radius: 6px; overflow-x: auto; border: 1px solid rgba(0,255,255,0.2); }
        .msg.bot code { font-family: 'Fira Code', monospace; font-size: 14px; }
        .msg.bot p code { background: rgba(0,255,255,0.1); padding: 2px 5px; border-radius: 4px; color: #0ff;}

        #input-area { display: flex; padding: 15px; background: rgba(0, 0, 0, 0.6); border-top: 1px solid rgba(0, 255, 255, 0.2); align-items: center; }
        input { flex: 1; padding: 12px 15px; background: rgba(0, 255, 255, 0.05); color: #0ff; border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 4px; outline: none; font-family: 'Rajdhani', sans-serif; font-size: 16px; letter-spacing: 1px; transition: all 0.3s ease; }
        input::placeholder { color: rgba(0, 255, 255, 0.3); }
        input:focus { border-color: #0ff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) inset; }
        
        .action-btn { padding: 12px 20px; margin-left: 10px; background: rgba(0, 255, 255, 0.05); color: #0ff; border: 1px solid #0ff; border-radius: 4px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 5px rgba(0, 255, 255, 0.1); transition: all 0.2s ease; }
        .action-btn:hover { background: rgba(0, 255, 255, 0.2); box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.3); text-shadow: 0 0 5px #fff; }
        
        /* JARVIS Logo Specific Styles & Animations */
        .mic-btn { padding: 8px 15px; display: flex; align-items: center; justify-content: center; }
        .jarvis-logo { width: 28px; height: 28px; color: #0ff; transition: all 0.3s ease; }
        .outer-ring, .inner-core { transform-origin: center; }
        @keyframes spinLogo { 100% { transform: rotate(360deg); } }
        @keyframes pulseCore { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.3); opacity: 1; } }
        .mic-btn.recording { border-color: #ff3333; box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); background: rgba(255, 0, 0, 0.1); }
        .mic-btn.recording .jarvis-logo { color: #ff3333; }
        .mic-btn.recording .outer-ring { animation: spinLogo 2s linear infinite; }
        .mic-btn.recording .inner-core { animation: pulseCore 1s ease-in-out infinite; }

        /* --- HISTORY MODAL STYLES --- */
        #history-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 50; }
        #history-box { width: 100%; max-width: 600px; height: 80vh; background: rgba(20, 10, 40, 0.8); border: 1px solid rgba(255, 0, 255, 0.3); border-radius: 12px; box-shadow: 0 0 30px rgba(255, 0, 255, 0.2), inset 0 0 15px rgba(255, 0, 255, 0.1); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        #history-header { background: linear-gradient(90deg, rgba(255, 0, 255, 0.1), rgba(255, 0, 255, 0.25), rgba(255, 0, 255, 0.1)); border-bottom: 1px solid rgba(255, 0, 255, 0.4); box-shadow: 0 2px 10px rgba(255, 0, 255, 0.2); }
        .clear-btn { background: rgba(255,0,0,0.2); color: #ff5555; border: 1px solid #ff5555; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; letter-spacing: 1px;}
        .clear-btn:hover { background: rgba(255,0,0,0.4); color: #fff; box-shadow: 0 0 10px red;}
    </style>
</head>
<body>

<!-- Hidden Audio Element for J.A.R.V.I.S Boot Sound -->
<audio id="jarvis-boot-sound" src="jarvis.mp3"></audio> 

<!-- Boot Sequence Overlay -->
<div id="boot-screen">
    <!-- Naya Initializer Button -->
    <button id="init-btn" onclick="startSystem()">[ INITIALIZE SYSTEM ]</button>
    
    <div id="boot-text-container">
        <div id="boot-text"></div>
        <span class="cursor"></span>
    </div>
</div>

<!-- Model Selection Nav -->
<div id="top-nav">
    <button class="model-btn active" onclick="setModel('general', this)">GENERAL</button>
    <button class="model-btn" onclick="setModel('math', this)">MATH</button>
    <button class="model-btn" onclick="setModel('code', this)">CODING</button>
    <button class="model-btn" onclick="setModel('image', this)">IMAGE GEN</button>
    <button class="model-btn history-btn" onclick="openHistory()">HISTORY LOGS</button>
</div>

<!-- Homepage Section -->
<div id="homepage">
    <h1>PROJECT NEXUS</h1>
    <p>Advanced AI Neural Network Online</p>
    <button class="chat-now-btn" onclick="openChat()">{CHAT NOW}</button>
</div>

<!-- Chat Box Section -->
<div id="chat-box">
    <div id="chat-header">
        <span class="system-status" id="status-text">AI // SYSTEM_ONLINE \\</span>
        <button class="close-btn" onclick="closeChat()">[ X ] CLOSE</button>
    </div>
    
    <div id="messages">
        <div class="msg bot">System initialized. J.A.R.V.I.S. Voice module active. How may I assist you today?</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type or click AI core to speak..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="mic-btn" class="action-btn mic-btn" onclick="toggleVoiceRecognition()" title="Voice Command">
            <svg class="jarvis-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="5" fill="none" stroke-dasharray="12 6" class="outer-ring"/>
                <circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="2" fill="none" opacity="0.6"/>
                <circle cx="50" cy="50" r="15" fill="currentColor" class="inner-core"/>
            </svg>
        </button>
        <button class="action-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- History Modal Section -->
<div id="history-modal">
    <div id="history-box">
        <div id="history-header">
            <span class="system-status" style="color: #f0f;">DATABANK // CHAT_HISTORY</span>
            <div>
                <button class="clear-btn" onclick="clearHistory()">PURGE DATA</button>
                <button class="close-btn" style="color: #f0f;" onclick="closeHistory()">[ X ] CLOSE</button>
            </div>
        </div>
        <div id="history-content"></div>
    </div>
</div>

<script>
    // --- Configure Markdown Highlighting ---
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        },
        breaks: true 
    });

    // --- Boot Sequence Logic (16 SECONDS TOTAL) ---
    const bootLines = [
        "> Establishing secure connection...",
        "> Bypassing mainframe security...",
        "> Loading RANJAN SYSTEM core protocols...",
        "> Synchronizing cloud databases...",
        "> Initializing neural network...",
        "> Calibrating J.A.R.V.I.S. audio interface...",
        "> Voice recognition module: ONLINE",
        "> Access Granted. Welcome, Boss."
    ];
    
    let bootIndex = 0;
    
    function startSystem() {
        // Button hide karein, text show karein
        document.getElementById('init-btn').style.display = 'none';
        document.getElementById('boot-text-container').style.display = 'flex';
        
        // J.A.R.V.I.S Audio play karein
        const bootSound = document.getElementById('jarvis-boot-sound');
        if (bootSound) {
            bootSound.play().catch(e => console.log("Audio play blocked by browser."));
        }
        
        // Sequence start karein
        runBootSequence();
    }

    function runBootSequence() {
        const bootTextElement = document.getElementById('boot-text');
        if (bootIndex < bootLines.length) {
            const line = document.createElement('div');
            line.className = 'boot-line';
            line.innerText = bootLines[bootIndex];
            bootTextElement.appendChild(line);
            bootIndex++;
            // Har line 2 seconds ke baad aayegi (8 lines * 2000ms = 16 seconds)
            setTimeout(runBootSequence, 2000); 
        } else {
            // Sequence khatam hone ke baad main screen open
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('homepage').style.display = 'flex';
                document.getElementById('top-nav').style.display = 'flex';
            }, 800);
        }
    }

    // --- Application State ---
    let currentMode = 'general';
    const API_KEY = 'AQ.Ab8RN6JLB80lIha610V8iwefO8llitINIbq6VB_EGjYwv7lcLA'; 
    
    // ⚠️ FIXED: Updated API Model Name to gemini-1.5-flash
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    // --- Voice Initialization ---
    let speechVoices = [];
    window.speechSynthesis.onvoiceschanged = () => { speechVoices = window.speechSynthesis.getVoices(); };

    // --- J.A.R.V.I.S. Voice Setup (Text-to-Speech) ---
    function speakAIResponse(text) {
        if (!window.speechSynthesis) return;
        
        let cleanText = text.replace(/[*#`]/g, ''); 
        const utterance = new SpeechSynthesisUtterance(cleanText);
        
        utterance.rate = 1.0; 
        utterance.pitch = 0.9; 
        
        let jarvisVoice = speechVoices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male')) || 
                          speechVoices.find(v => v.name.includes('Daniel')) || 
                          speechVoices.find(v => v.name.includes('George')) || 
                          speechVoices.find(v => v.name.includes('David')) || 
                          speechVoices.find(v => v.lang.includes('IN') && v.name.toLowerCase().includes('male')); 
        
        if (jarvisVoice) { 
            utterance.voice = jarvisVoice; 
        }
        
        window.speechSynthesis.speak(utterance);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN'; 
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            document.getElementById('mic-btn').classList.add('recording');
            document.getElementById('user-input').placeholder = "Listening...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('user-input').value = transcript;
            sendMessage(); 
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error", event.error);
            stopRecordingUI();
        };

        recognition.onend = () => { stopRecordingUI(); };
    }

    function toggleVoiceRecognition() {
        if (!recognition) return alert("Your browser does not support voice recognition. Try Google Chrome.");
        if (isRecording) { recognition.stop(); } 
        else { window.speechSynthesis.cancel(); recognition.start(); }
    }

    function stopRecordingUI() {
        isRecording = false;
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('user-input').placeholder = "Type or click AI core to speak...";
    }

    // --- History / Local Storage Functions ---
    function saveToHistory(text, sender) {
        let history = JSON.parse(localStorage.getItem('nexus_chat_history')) || [];
        history.push({ text: text, sender: sender, timestamp: new Date().toLocaleString() });
        localStorage.setItem('nexus_chat_history', JSON.stringify(history));
    }

    function openHistory() {
        const historyBox = document.getElementById('history-content');
        historyBox.innerHTML = ''; 
        let history = JSON.parse(localStorage.getItem('nexus_chat_history')) || [];
        
        if (history.length === 0) {
            historyBox.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.5); margin-top:20px;">No records found in databank.</p>';
        } else {
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = `msg ${item.sender}`;
                if (item.sender === 'bot') {
                    div.innerHTML = `<div class="timestamp">${item.timestamp}</div><div>${marked.parse(item.text)}</div>`;
                } else {
                    div.innerHTML = `<div class="timestamp">${item.timestamp}</div><div>${item.text}</div>`;
                }
                historyBox.appendChild(div);
            });
        }
        document.getElementById('history-modal').style.display = 'flex';
    }

    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }

    function clearHistory() {
        if(confirm("Are you sure you want to purge all databank records? This cannot be undone.")) {
            localStorage.removeItem('nexus_chat_history'); openHistory(); 
        }
    }

    // --- UI Toggle Functions ---
    function setModel(mode, btnElement) {
        currentMode = mode;
        document.querySelectorAll('.model-btn:not(.history-btn)').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }

    function openChat() {
        document.getElementById('homepage').style.display = 'none';
        document.getElementById('top-nav').style.display = 'none';
        document.getElementById('chat-box').style.display = 'flex';
    }

    function closeChat() {
        document.getElementById('chat-box').style.display = 'none';
        document.getElementById('homepage').style.display = 'flex';
        document.getElementById('top-nav').style.display = 'flex';
        window.speechSynthesis.cancel(); 
    }

    // --- Chat Logic ---
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return; 

        addMessage(text, 'user');
        saveToHistory(text, 'user');
        input.value = ''; 
        
        window.speechSynthesis.cancel(); 

        let systemPrompt = "";
        if (currentMode === 'code') {
            systemPrompt = "You are an expert full-stack software engineer. Provide highly optimized, production-ready code. Format it cleanly using Markdown. User query: ";
        } else if (currentMode === 'math') {
            systemPrompt = "You are a university mathematics professor. Solve this step-by-step, showing all logical deductions and formulas clearly. User query: ";
        } else if (currentMode === 'image') {
            systemPrompt = "You are an AI image prompt engineer. Write a highly detailed, descriptive prompt for DALL-E or Midjourney based on this query: ";
        } else {
            systemPrompt = "You are Project Nexus, an advanced AI. Answer the following query clearly and concisely: ";
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt + text }] }] })
            });
            
            const data = await response.json();
            
            // ⚠️ FIXED: Added Error Checking Block
            if (data.candidates && data.candidates.length > 0) {
                const botReply = data.candidates[0].content.parts[0].text;
                addMessage(botReply, 'bot');
                saveToHistory(botReply, 'bot'); 
                speakAIResponse(botReply);
            } else if (data.error) {
                addMessage(`API Error: ${data.error.message}`, 'bot');
                console.error("Google API Error:", data.error);
            } else {
                addMessage("System Error: No valid response data received.", 'bot');
            }
        } catch (error) {
            addMessage("Connection Failure. Please verify network or API token.", 'bot');
            console.error("Fetch Error:", error);
        }
    }

    // --- Helper Function for Rendering Markdown ---
    function addMessage(text, sender) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        
        if (sender === 'bot') {
            div.innerHTML = marked.parse(text);
        } else {
            div.textContent = text;
        }
        
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
